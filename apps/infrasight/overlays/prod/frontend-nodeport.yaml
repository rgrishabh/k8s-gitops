# Host nginx terminates TLS for infrasight.rgrishabh.in and proxies to this
# NodePort on 192.168.49.2, which has no route from the internet.
apiVersion: v1
kind: Service
metadata: { name: frontend }
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32010
      protocol: TCP
