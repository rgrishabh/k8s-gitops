apiVersion: apps/v1
kind: Deployment
metadata: { name: worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      # No hostname/name pinning: each replica takes its pod identity as the
      # worker id, so scaling up does not collapse three workers into one
      # heartbeat row.
      containers:
        - name: worker
          image: infrasight/backend   # same image as the API, different role
          imagePullPolicy: IfNotPresent
          args: ["worker"]
          envFrom:
            - configMapRef: { name: infrasight-config }
            - secretRef:    { name: infrasight-secrets }
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://infrasight:$(POSTGRES_PASSWORD)@postgres:5432/infrasight
            - name: WORKER_REGION
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          # Deliberately NO liveness probe.
          #
          # The compose file healthchecks this with `pgrep -f monitor_worker`,
          # but procps is not installed in python:3.12-slim, so pgrep exits 127
          # and the check can only ever fail. In Compose that merely marks the
          # container unhealthy; as a Kubernetes liveness probe it KILLS it --
          # the worker was being SIGTERMed every 150s (60s initialDelay + 3x30s)
          # and had racked up 19 restarts.
          #
          # None is needed: the worker is PID 1 under tini, so if it dies the
          # container exits and Kubernetes restarts it anyway. Real worker
          # liveness is the heartbeat rows the API reports via /health.
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 768Mi }
