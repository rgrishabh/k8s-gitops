apiVersion: apps/v1
kind: Deployment
metadata: { name: worker }
spec:
  replicas: 1
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app: worker } }
    spec:
      # No hostname/name pinning: each replica takes its pod identity as the
      # worker id, so scaling up does not collapse three workers into one
      # heartbeat row.
      containers:
        - name: worker
          image: infrasight/backend   # same image as the API, different role
          imagePullPolicy: IfNotPresent
          args: ["worker"]
          envFrom:
            - configMapRef: { name: infrasight-config }
            - secretRef:    { name: infrasight-secrets }
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://infrasight:$(POSTGRES_PASSWORD)@postgres:5432/infrasight
            - name: WORKER_REGION
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          livenessProbe:
            exec: { command: ["sh","-c","pgrep -f monitor_worker > /dev/null"] }
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1,    memory: 768Mi }
